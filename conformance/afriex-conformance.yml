domain_standards:
  regime: financial-services / cross-border-payments
  note: 'Reward-only check. Afriex serves a market that does have domain standards (ISO
    20022 for payment messaging, PSD2/Open Banking for European account access, FDX for
    financial data sharing), and the contract declares NONE of them. What it does declare
    are the correspondent-banking identifier schemes below, which are real domain signals
    but sit a level below a full message standard. Nothing has been invented to fill the
    slot.'
  declared:
  - id: swift-bic-identifiers
    conforms: true
    evidence: 'GET /api/v1/payment-method/institution/codes — codeType accepts SWIFT and
      routing number; PaymentMethod supports a SWIFT channel with bank address fields.'
  - id: us-aba-routing-numbers
    conforms: true
    evidence: Same operation resolves US routing numbers to institution names.
  not_declared:
  - {id: iso-20022, conforms: false, evidence: 'No pain/pacs/camt message types, no ISO 20022 element names in any schema.'}
  - {id: psd2-open-banking, conforms: false, evidence: 'No PSD2/OBIE endpoints, no strong-customer-authentication flows, no consent resource.'}
  - {id: fdx, conforms: false, evidence: No FDX resources or FDX-shaped account/transaction models.}
compliance_program:
  published: false
  trust_center: null
  certifications: []
  note: 'No trust center, no SOC 2 / ISO 27001 / PCI DSS statement, and no compliance page
