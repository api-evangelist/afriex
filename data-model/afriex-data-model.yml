identifiers:
- entity: Customer
  field: customerId
  note: Returned on create; required on all customer-scoped operations and on transactions.
- entity: Customer
  field: reference
  note: Per-customer reference used as the pool-account reference when submitting a deposit payment proof.
- entity: PaymentMethod
  field: paymentMethodId
  note: Used as sourceId on a DEPOSIT and destinationId on a WITHDRAW.
- entity: Transaction
  field: transactionId
  note: Used for status polling, OTP authorization, settlement advice, and carried on webhook payloads.
- entity: Transaction
  field: meta.reference
  note: Caller-supplied correlation reference, echoed on the transaction and its webhooks; also the sandbox
    outcome-control field.
