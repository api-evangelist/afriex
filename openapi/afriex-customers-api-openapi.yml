  /api/v1/customer/{customerId}/kyc:
    parameters:
    - $ref: '#/components/parameters/x-api-version'
    patch:
      operationId: updateCustomerKyc
      summary: Update customer KYC information
      description: Partially updates a customer's KYC information.
      tags:
      - Customers
      parameters:
      - name: customerId
        in: path
        description: The unique identifier of the customer
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'A flat map of KYC document types to their values. Send the document map directly as the request body (do not wrap it in a `kyc` field). Each key must be one of the allowed KYC document types and each value is a string.


                `PHONE` and `COUNTRY` are not accepted here; they are profile fields owned by `PATCH /api/v1/customer/{customerId}`. `BVN` is not accepted either; it is owned by `POST /api/v1/customer/{customerId}/verify`, which writes it only after a successful bank verification. Sending any of the three returns `400 INVALID_KYC_DOCUMENT_TYPE`.'
              additionalProperties:
                type: string
              propertyNames:
                enum:
                - REPRESENTATIVE_TYPE
                - DATE_OF_BIRTH
                - ADDRESS
                - BANK_STATEMENT
                - BUSINESS_CERTIFICATE
                - ID_FRONT
                - ID_BACK
                - SELFIE
                - PROOF_OF_ADDRESS
                - PROOF_OF_INCOME
                - DRIVER_LICENSE
                - PASSPORT
                - NATIONAL_ID
                - PAYMENT_METHOD
                - RESIDENCE_PERMIT
                - VEHICLE_REGISTRATION
                - VOTER_ID
                - OTHERS
              examples:
              - PASSPORT: passport.png
                DATE_OF_BIRTH: '2000-01-01'
            examples:
              passport:
                summary: Passport number and date of birth (Ghana)
                value:
                  PASSPORT: A12345678
                  DATE_OF_BIRTH: '1990-05-15'
              nationalId:
                summary: National ID (Ghana)
                value:
                  NATIONAL_ID: GHA-123456789-0
                  DATE_OF_BIRTH: '1990-05-15'
              driverLicense:
                summary: Driver's license (Kenya)
                value:
                  DRIVER_LICENSE: DL-987654
                  DATE_OF_BIRTH: '1990-05-15'
              documentUpload:
                summary: Uploaded identity documents
                value:
                  ID_FRONT: id-front.png
                  ID_BACK: id-back.png
                  SELFIE: selfie.png
      responses:
        '200':
          description: Customer updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              examples:
                success:
                  summary: KYC updated
                  value:
                    data:
                      name: Test User KYC
                      email: test.kyc.user@example.com
                      phone: '+2348192837001'
                      customerId: 69d5fff7ab82306f11b0330e
                      reference: afx121011
                      countryCode: NG
                      meta:
                        kyc:
                          data:
                            PASSPORT: A12345678
                            DATE_OF_BIRTH: '1990-05-15'
                      createdAt: '2026-04-08T07:12:55.888Z'
                      updatedAt: '2026-04-08T07:17:18.638Z'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidKycType:
                  summary: Invalid KYC document type key
                  value:
                    code: INVALID_KYC_DOCUMENT_TYPE
                    error: Invalid kyc document type
                    details:
                      errorMessage: Invalid kyc document type
                      friendlyMessage: Invalid KYC document type provided
                invalidBvn:
                  summary: Invalid BVN value
                  value:
                    code: INVALID_KYC_DOCUMENT_TYPE
                    error: Invalid kyc document type
                    details:
                      errorMessage: Invalid kyc document type
                      friendlyMessage: Invalid BVN provided
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingApiKey:
                  summary: Missing API key
                  value:
                    code: AUTHENTICATION_ERROR
                    error: Authorization header is missing
                    details: {}
                invalidApiKey:
                  summary: Invalid API key
                  value:
                    code: AUTHENTICATION_ERROR
                    error: Invalid authorization header
                    details: {}
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Customer not found
                  value:
