            schema:
              type: object
              properties:
                docType:
                  type: string
                  description: The type of document to verify.
                  enum:
                  - BVN
                docValue:
                  type: string
                  minLength: 1
                  description: The document number to verify.
              required:
              - docType
              - docValue
            examples:
              bvn:
                summary: Verify a Nigerian BVN
                value:
                  docType: BVN
                  docValue: '22222222222'
