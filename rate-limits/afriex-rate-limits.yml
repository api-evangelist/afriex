note: 'Afriex documents that rate limiting exists but publishes no numbers. The OpenAPI
  contract declares exactly one 429 response (on verifyCustomer, whose description states
  "Verification is rate limited per business"), and the Integration Guide has a Rate
  Limiting section that gives only behavioural advice — implement exponential backoff,
  cache exchange rates, use webhooks instead of polling. No request-per-window figure, no
  burst allowance, and no per-scope breakdown is stated anywhere in the docs, the contract
  or the Agent Skill. This is recorded as an honest zero rather than omitted.'
