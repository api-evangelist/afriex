  note: 'No RateLimit-*, X-RateLimit-* or Retry-After response header is documented. This is
    the more consequential gap than the missing numbers: an agent has no runtime signal for
    how much budget it has left or how long to wait, and can only discover exhaustion by
    receiving a 429 and guessing a backoff. Headers were not observed live because every
    endpoint requires an API key, so an unauthenticated probe cannot reach a rate-limited
    2xx response to read them from.'
