named_codes:
- code: EMAIL_ALREADY_EXISTS
  status: 409
  operation: createCustomer
  meaning: A customer with this email already exists.
  remediation: details.data.customerId carries the existing customer id — adopt it rather than retrying
    the create.
- code: PHONE_NUMBER_ALREADY_EXISTS
  status: 409
  operation: createCustomer
  meaning: A customer with this phone number already exists.
  remediation: details.data.customerId carries the existing customer id — adopt it rather than retrying
    the create.
- code: INVALID_BUSINESS_CUSTOMER_REQUEST
  status: 400
  operation: createCustomer
  meaning: Customer payload failed validation; details.errorMessage names the specific failure (e.g. PHONE_COUNTRY_MISMATCH).
  remediation: Correct the named field. Phone numbers must be E.164 and match countryCode.
  source: https://docs.afriex.com/development
- code: VIRTUAL_ACCOUNT_LIMIT_REACHED
  status: 422
  operation: createVirtualAccount
  meaning: The per-(business, customer, currency) virtual-account limit would be exceeded.
  remediation: Reuse an existing virtual account from listVirtualAccounts.
- code: VIRTUAL_ACCOUNT_PENDING_COMPLIANCE_REVIEW
  status: 422
  operation: createVirtualAccount
  meaning: Issuance for this business/currency requires a compliance-approved application; the first request
    starts that review.
  remediation: Retry once the review is approved.
- code: NOT_FOUND_ERROR
  status: 404
  operation: '*'
  meaning: Unrouted path on the API host.
  remediation: Check the path; observed live on api.afriex.com for unknown routes.
  source: probed 2026-09-12
failure_reason_codes:
  field: meta.failureReason.code
  prefix: AFX_
  note: Transaction-level failure reasons are returned on the transaction object rather than as HTTP errors,
    under meta.failureReason.code with an AFX_ prefix. The provider Agent Skill names the field and the
    prefix and instructs callers to branch on the code, but no enumerated registry of AFX_* values is
    published in the contract or the docs, so the full list is not recorded here. Asking Afriex to publish
    that registry is the single highest-value error-semantics improvement available to them.
  enumerated: false
http_status_reference: https://docs.afriex.com/development
