rfc9457: false
note: 'Afriex does not use RFC 9457 application/problem+json. Every error on every operation is application/json
  against a single ErrorResponse schema: {code, error, details{errorMessage, friendlyMessage, data}}.
  The envelope is consistent across all 32 operations, which is the property that matters for an agent
  even though the media type is not the standard one. Branch on code; show details.friendlyMessage to
  a user. For transaction failures specifically the provider Agent Skill directs callers to branch on
  meta.failureReason.code (AFX_* codes), which are stable, rather than on the message text.'
