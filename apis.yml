aid: afriex
name: Afriex
description: 'Afriex is a cross-border payments and remittance company that moves money between Africa,
  North America, Europe and Asia. Its consumer app handles person-to-person remittances, while the Afriex
  Business API gives companies programmatic access to the same rails: customer onboarding and KYC, payment
  methods across bank accounts, mobile money, SWIFT, UPI, Interac and USDC/USDT crypto wallets, multi-currency
  wallet balances and real-time FX rates, deposits, withdrawals and in-wallet currency swaps, hosted checkout
  sessions, virtual and pool collection accounts, and RSA-signed webhooks for transaction lifecycle events.
  The API is documented with an OpenAPI 3.1 contract, a first-party TypeScript SDK, and a hosted remote
  MCP server that exposes the same surface to AI agents.'
