- aid: afriex-mcp-server
  name: Afriex MCP Server
  description: 'Afriex publishes a hosted, remote Model Context Protocol server at
    https://mcp.afriex.com/mcp that exposes 26 tools covering the Business API surface —
    customers, transactions, payment methods, institutions, crypto wallets, virtual and
    pool accounts, checkout sessions, balances, FX rates and test webhook triggers. The
    server initializes anonymously and answers tools/list without credentials; API calls
    are authenticated per session either with x-afriex-api-key / x-afriex-environment HTTP
    headers or by calling the authenticate tool as the first action.'
  humanURL: https://docs.afriex.com/mcp/introduction
  baseURL: https://mcp.afriex.com/mcp
