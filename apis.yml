apis:
- aid: afriex-business-api
  name: Afriex Business API
  description: 'The Afriex Business API is a REST API for cross-border money movement.
    It covers customer creation and KYC verification, payment-method registration across
    bank accounts, mobile money, SWIFT, UPI, Interac and crypto wallets, institution and
    recipient resolution, DEPOSIT / WITHDRAW / SWAP transactions with OTP authorization,
    multi-currency wallet balances and live FX rates, hosted checkout sessions, virtual
    and pool collection accounts, SME registration, presigned media upload for KYC
    documents, and five families of RSA-SHA256 signed webhook events. Authentication is a
    per-key, permission-scoped x-api-key header; the contract is OpenAPI 3.1 with 32
    operations and in-spec webhooks.'
  humanURL: https://docs.afriex.com/
  baseURL: https://api.afriex.com
